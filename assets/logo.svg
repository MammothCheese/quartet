<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>QUARTET</title>
  <!-- four stompboxes, one per track: LEAD gold, PAD violet, BASS cyan, DRUMS green -->
  <rect x="0" y="0" width="96" height="96" rx="18" fill="#18181f"/>
  <g stroke="#06060a" stroke-width="2">
    <rect x="12" y="12" width="32" height="32" rx="6" fill="#ffb824"/>
    <rect x="52" y="12" width="32" height="32" rx="6" fill="#b27cff"/>
    <rect x="12" y="52" width="32" height="32" rx="6" fill="#24c6f0"/>
    <rect x="52" y="52" width="32" height="32" rx="6" fill="#5ce268"/>
  </g>
  <g fill="#101014">
    <circle cx="22" cy="22" r="4"/><circle cx="34" cy="22" r="4"/>
    <circle cx="62" cy="22" r="4"/><circle cx="74" cy="22" r="4"/>
    <circle cx="22" cy="62" r="4"/><circle cx="34" cy="62" r="4"/>
    <circle cx="62" cy="62" r="4"/><circle cx="74" cy="62" r="4"/>
  </g>
  <g fill="#e8e8f0" stroke="#06060a" stroke-width="1.5">
    <circle cx="28" cy="36" r="4"/><circle cx="68" cy="36" r="4"/>
    <circle cx="28" cy="76" r="4"/><circle cx="68" cy="76" r="4"/>
  </g>
</svg>
